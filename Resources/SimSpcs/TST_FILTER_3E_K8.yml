Constants:
    PER: 2500
Clock:
  - clkNm: CLK
    per: PER
    initVal: 0
FinishTime: 515*PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
      - [X, 0]
  - tm: 1.1*PER
    vls:
      - [INIT, 0]
  - tm: 1.5*PER
    vls:
      -   - X
          - '0x100000'
  - tm: 2.5*PER
    vls:
      -   - X
          - 0
SaveNds:
  - name: OUT
    format: h
  - name: DATA_OUT
    format: h
