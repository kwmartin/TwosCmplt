Constants:
    PER: 1000
FinishTime: 64*PER
Inputs:
    CLK: 1
    INIT: 1
    VDD: 1
    VSS: 1
Clock:
  - clkNm: CLK
    per: PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
  - tm: PER
    vls:
      - [INIT, 0]
SaveNds:
  - name: OUT
    format: h
