Constants:
    PER: 1000
Clock:
  - clkNm: CLK
    per: PER
    initVal: 0
FinishTime: 64*PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD_, 1]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
      - [COEF, '0x10000']
      - [D0_, 0]
      - [IN, '0x100000']
      - [RG_23, 0]
  - tm: 0.1*PER
    vls:
      - [INIT, 0]
SaveNds:
  - name: C_24
    format: b
  - name: DATA_OUT
    format: h
  - name: G_24
    format: b
  - name: P_32
    format: b
  - name: RG2N_
    format: h
  - name: RG2_
    format: h
  - name: RGN_
    format: h
