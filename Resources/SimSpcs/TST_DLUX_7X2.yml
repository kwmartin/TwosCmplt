Constants:
    PER: 1000
Clock:
  - clkNm: CLK
    per: PER
FinishTime: 64*PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
      - [L, 0]
      - [LI, 0]
      - [U, 0]
      - [Q0, 1]
  - tm: 1.1*PER
    vls:
      -   - INIT
          - 0
  - tm: 6.1*PER
    vls:
      -   - L
          - 0
  - tm: 15.1*PER
    vls:
      -   - U
          - 0
SaveNds:
  - name: QP
    format: b
  - name: QN
    format: b
