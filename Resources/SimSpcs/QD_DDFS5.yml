Constants:
    PER: 1000
Clock:
  - clkNm: CLK
    per: PER
FinishTime: 64*PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
      - [FRQ, '0x40000000']
  - tm: 0.1*PER
    vls:
      -   - INIT
          - 0
SaveNds:
  - name: SINE
    format: s
  - name: COS
    format: s
