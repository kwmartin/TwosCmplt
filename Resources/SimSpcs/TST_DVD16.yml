Constants:
    PER: 1000
Clock:
  - clkNm: CLK
    per: PER
    initVal: 0
FinishTime: 64*PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
  - tm: 0.1*PER
    vls:
      - [INIT, 0]
SaveNds:
  - name: CLN
    format: h
  - name: CLP
    format: h
