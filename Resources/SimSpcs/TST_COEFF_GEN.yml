Constants:
    PER: 1000
Clock:
  - clkNm: CLK
    per: PER
    initVal: 0
  - clkNm: C_24
    per: PER
    initVal: 0
FinishTime: 64*PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD_, 1]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
      - [COEF, 0]
      - [D0_, 0]
      - [IN, 0]
      - [K, 0]
      - [SIG, 0]
      - [SIG19, 0]
      - [C_24, 0]
  - tm: 0.1*PER
    vls:
      - [INIT, 0]
SaveNds:
  - name: DATA_OUT
    format: h
  - name: G_24
    format: b
  - name: O
    format: h
  - name: P_32
    format: b
  - name: RGN_
    format: h
