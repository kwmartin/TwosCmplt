Constants:
    PER: 1000
Clock:
  - clkNm: CLK
    per: PER
FinishTime: 513*PER
TimeSpcs:
  - tm: 0
    vls:
      - [CLK, 0]
      - [VDD, 1]
      - [VSS, 0]
      - [INIT, 1]
      - [D, '0xff']
  - tm: 0.1*PER
    vls:
      - [INIT, 0]
SaveNds:
  - name: QP
    format: h
  - name: QN
    format: h
