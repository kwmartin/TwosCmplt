            oper: 'BLessThan:'
            args:
            -   kind: sys_tm
                name: time
            -   kind: float
                value: 100.0
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: STATE
            rvalue:
                kind: int
                value: 0
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_ident
                node: R
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: STATE
                rvalue:
                    kind: int
                    value: 0
            ifelse:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: STATE
                rvalue:
                    kind: ident
                    name: D

