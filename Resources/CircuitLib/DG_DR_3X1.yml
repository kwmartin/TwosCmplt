kind: verilog
module: DG_DR_3X1
params:
-   kind: str
    name: circuit
    value: sync
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: D
-   name: R
-   name: CLK
-   name: QP
-   name: VDD
-   name: VSS
decls:
-   -   kind: Input
        name: D
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: R
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: CLK
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VDD
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VSS
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: QP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Reg
        name: STATE
        signed: 'False'
        width:
        - 0
        - 0
        length: []
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: QP
    rvalue:
        kind: ident
        name: STATE
    delay: 0
-   kind: initial
