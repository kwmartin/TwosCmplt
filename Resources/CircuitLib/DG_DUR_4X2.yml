kind: verilog
module: DG_DUR_4X2
params:
-   kind: str
    name: circuit
    value: sync
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: U
-   name: D
-   name: R
-   name: CLK
-   name: QP
-   name: QN
-   name: VDD
-   name: VSS
decls:
-   -   kind: Input
        name: U
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: D
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: R
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: CLK
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VDD
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VSS
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: QP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: QN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Reg
        name: QP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Reg
        name: QN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
behav_blcks:
-   kind: initial
    stmnts:
    -   kind: blckst
        lvalue:
            kind: ident
            name: QP
        rvalue:
            kind: int
            value: 0
    -   kind: blckst
        lvalue:
            kind: ident
            name: QN
        rvalue:
            kind: int
            value: 1
-   kind: always
    onlyif:
    -   edge: negedge
        node: CLK
    -   edge: posedge
        node: R
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_expr
            oper: 'BLessThan:'
            args:
            -   kind: sys_tm
                name: time
            -   kind: float
                value: 100.0
        iftrue:
        -   kind: blckst
            lvalue:
                kind: ident
                name: QP
            rvalue:
                kind: int
                value: 0
        -   kind: blckst
            lvalue:
                kind: ident
                name: QN
            rvalue:
                kind: int
                value: 1
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_ident
                node: R
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QP
                rvalue:
                    kind: int
                    value: 0
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QN
                rvalue:
                    kind: int
                    value: 1
            ifelse:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QP
                rvalue:
                    kind: cndexpr
                    args:
                    -   kind: ident
                        name: U
                    -   kind: ident
                        name: D
                    -   kind: ident
                        name: QP
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QN
                rvalue:
                    kind: cndexpr
                    args:
                    -   kind: ident
                        name: U
                    -   kind: uexpr
                        oper: 'Unot:'
                        args:
                        -   kind: ident
                            name: D
                    -   kind: ident
                        name: QN
