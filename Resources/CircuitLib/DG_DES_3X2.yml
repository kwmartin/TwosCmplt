kind: verilog
module: DG_DES_3X2
params:
-   kind: str
    name: circuit
    value: sync
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: D
    direct: Input
-   name: S
    direct: Input
-   name: CLK
    direct: Input
-   name: QP
    direct: Output
-   name: QN
    direct: Output
-   name: VDD
    direct: Input
-   name: VSS
    direct: Input
decls:
-   -   kind: Input
        name: D
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: S
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: CLK
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VDD
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VSS
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: QP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: QN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Reg
        name: STATE
        signed: 'False'
        width:
        - 0
        - 0
        length: []
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: QP
    rvalue:
        kind: ident
        name: STATE
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: QN
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: STATE
    delay: 0
-   kind: initial
    stmnts:
    -   kind: blckst
        lvalue:
            kind: ident
            name: STATE
        rvalue:
            kind: int
            value: 1
-   kind: always
    onlyif:
    -   edge: negedge
        node: CLK
    -   edge: posedge
        node: S
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_expr
            oper: 'BLessThan:'
            args:
            -   kind: sys_tm
                name: time
            -   kind: float
                value: 100.0
        iftrue:
        -   kind: blckst
            lvalue:
                kind: ident
                name: STATE
            rvalue:
                kind: int
                value: 1
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_ident
                node: S
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: STATE
                rvalue:
                    kind: int
                    value: 1
            ifelse:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: STATE
                rvalue:
                    kind: ident
                    name: D

