            cmpr_expr:
                kind: cmpr_unary
                arg:
                    kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: R
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QP
                rvalue:
                    kind: int
                    value: 0
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QN
                rvalue:
                    kind: int
                    value: 1
            ifelse:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QP
                rvalue:
                    kind: ident
                    name: D
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QN
                rvalue:
                    kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: D
