kind: verilog
module: dg_d_diff
params:
-   kind: str
    name: circuit
    value: sync
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: dp
-   name: dn
-   name: cp
-   name: cn
-   name: qop
-   name: qon
-   name: vdd
-   name: vss
decls:
-   -   kind: Input
        name: dp
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: dn
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: cp
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: cn
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: vdd
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: vss
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: qop
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: qon
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Reg
        name: qp
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Reg
        name: qn
        signed: 'False'
        width:
        - 0
        - 0
        length: []
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: qop
    rvalue:
        kind: ident
        name: qp
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: qon
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: qp
    delay: 0
-   kind: initial
    stmnts:
    -   kind: blckst
        lvalue:
            kind: ident
            name: qp
        rvalue:
            kind: int
            value: 0
    -   kind: blckst
        lvalue:
            kind: ident
            name: qn
        rvalue:
            kind: int
            value: 1
-   kind: always
    onlyif:
    -   edge: negedge
        node: cp
    -   edge: posedge
        node: cn
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_expr
            oper: 'BLessThan:'
            args:
            -   kind: sys_tm
                name: time
            -   kind: float
                value: 100.0
        iftrue:
        -   kind: blckst
            lvalue:
                kind: ident
                name: qp
            rvalue:
                kind: int
                value: 0
        -   kind: blckst
            lvalue:
                kind: ident
                name: qn
            rvalue:
                kind: int
                value: 1
        ifelse:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: qp
            rvalue:
                kind: ident
                name: dp
        -   kind: noblckst
            lvalue:
                kind: ident
                name: qn
            rvalue:
                kind: uexpr
                oper: 'Unot:'
                args:
                -   kind: ident
                    name: dp

