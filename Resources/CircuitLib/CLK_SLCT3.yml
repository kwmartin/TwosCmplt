        cmpr_expr:
            kind: cmpr_gate
            gate:
                kind: gt_expr
                oper: 'BAnd:'
                args:
                -   kind: ident
                    name: S1P
                -   kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: S2P
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: OUT
            rvalue:
                kind: ident
                name: D1P
    -   kind: ifst
