io_ports:
-   name: u
-   name: d
-   name: init
-   name: i_d
-   name: cp
-   name: qop
-   name: qon
-   name: vdd
-   name: vss
decls:
-   -   kind: Input
        name: u
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: d
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: init
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: i_d
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: cp
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: vdd
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: vss
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: qop
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: qon
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Reg
        name: qp
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Reg
        name: qn
        signed: 'False'
        width:
        - 0
        - 0
        length: []
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: qop
    rvalue:
        kind: ident
        name: qp
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: qon
    rvalue:
        kind: ident
        name: qn
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: qp
    rvalue:
        kind: ident
        name: i_d
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: qn
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: i_d
    delay: 0
-   kind: initial
    stmnts:
    -   kind: blckst
        lvalue:
            kind: ident
            name: qp
        rvalue:
            kind: int
            value: 0
    -   kind: blckst
        lvalue:
            kind: ident
            name: qn
        rvalue:
            kind: int
            value: 1
-   kind: always
    onlyif:
    -   edge: all
        node: init
    -   edge: all
        node: i_d
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_ident
            node: init
        iftrue: []
        ifelse:
        -   lvalue:
                kind: ident
                name: qp
        -   lvalue:
                kind: ident
                name: qn
-   kind: always
    onlyif:
    -   edge: negedge
        node: cp
    -   edge: all
        node: init
    -   edge: all
        node: i_d
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_expr
            oper: 'BLessThan:'
            args:
            -   kind: sys_tm
                name: time
            -   kind: float
                value: 100.0
        iftrue:
        -   kind: blckst
            lvalue:
                kind: ident
                name: qp
            rvalue:
                kind: ident
                name: i_d
        -   kind: blckst
            lvalue:
                kind: ident
                name: qn
            rvalue:
                kind: uexpr
                oper: 'Unot:'
                args:
                -   kind: ident
                    name: i_d
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_ident
                node: init
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: qp
                rvalue:
                    kind: ident
                    name: i_d
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: qn
                rvalue:
                    kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: i_d
            ifelse:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: qp
                rvalue:
                    kind: cndexpr
                    args:
                    -   kind: ident
                        name: u
                    -   kind: ident
                        name: d
                    -   kind: ident
                        name: qp
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: qn
                rvalue:
                    kind: cndexpr
                    args:
                    -   kind: ident
                        name: u
                    -   kind: uexpr
                        oper: 'Unot:'
                        args:
                        -   kind: ident
                            name: d
                    -   kind: ident
                        name: qn

