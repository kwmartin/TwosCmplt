kind: verilog
module: KM_DEGLITCH
params:
-   kind: str
    name: circuit
    value: async
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: RIP
    direct: Input
-   name: RIN
    direct: Input
-   name: QIP
    direct: Input
-   name: QIN
    direct: Input
-   name: RP
    direct: Output
-   name: RN
    direct: Output
-   name: QP
    direct: Output
-   name: QN
    direct: Output
-   name: VDD
    direct: Input
-   name: VSS
    direct: Input
decls:
-   -   kind: Input
        name: RIP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: RIN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: QIP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: QIN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VDD
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VSS
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: RP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: RN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: QP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: QN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Reg
        name: RSTATE
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Reg
        name: QSTATE
        signed: 'False'
        width:
        - 0
        - 0
        length: []
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: RP
    rvalue:
        kind: ident
        name: RSTATE
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: RN
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: RSTATE
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: QP
    rvalue:
        kind: ident
        name: QSTATE
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: QN
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: QSTATE
    delay: 0
-   kind: initial
    stmnts:
    -   kind: blckst
        lvalue:
            kind: ident
            name: RSTATE
        rvalue:
            kind: int
            value: 0
    -   kind: blckst
        lvalue:
            kind: ident
            name: QSTATE
        rvalue:
            kind: int
            value: 0
-   kind: always
    onlyif:
    -   edge: all
        node: RIP
    -   edge: all
        node: RIN
    -   edge: all
        node: QIP
    -   edge: all
        node: QIN
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_expr
            oper: 'BLessThan:'
            args:
            -   kind: sys_tm
                name: time
            -   kind: float
                value: 100.0
        iftrue:
        -   kind: blckst
            lvalue:
                kind: ident
                name: RSTATE
            rvalue:
                kind: int
                value: 0
        -   kind: blckst
            lvalue:
                kind: ident
                name: QSTATE
            rvalue:
                kind: int
                value: 0
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_gate
                gate:
                    kind: gt_expr
                    oper: 'BAnd:'
                    args:
                    -   kind: ident
                        name: RIP
                    -   kind: ident
                        name: QIN
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: RSTATE
                rvalue:
                    kind: int
                    value: 1
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_gate
                gate:
                    kind: gt_expr
                    oper: 'BAnd:'
                    args:
                    -   kind: ident
                        name: RIN
                    -   kind: ident
                        name: QIP
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: RSTATE
                rvalue:
                    kind: int
                    value: 0
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_gate
                gate:
                    kind: gt_expr
                    oper: 'BAnd:'
                    args:
                    -   kind: ident
                        name: QIP
                    -   kind: ident
                        name: RIP
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QSTATE
                rvalue:
                    kind: int
                    value: 1
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_gate
                gate:
                    kind: gt_expr
                    oper: 'BAnd:'
                    args:
                    -   kind: ident
                        name: QIN
                    -   kind: ident
                        name: RIN
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QSTATE
                rvalue:
                    kind: int
                    value: 0

