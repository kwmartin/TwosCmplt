kind: verilog
module: CMPL
params:
-   kind: str
    name: circuit
    value: async
-   kind: int
    name: nbits
    value: 8
-   kind: Int
    name: delay
    value: 5
io_ports:
-   kind: Wire
    name: INVRT
    direct: 'Input:'
    signed: 'False'
-   kind: Wire
    name: IN
    direct: 'Input:'
    signed: 'False'
    width:
    -   kind: bexpr
        oper: 'BMinus:'
        args:
        -   kind: ident
            name: nbits
        -   kind: int
            value: 1
    -   kind: int
        value: 0
-   kind: Wire
    name: OUT
    direct: 'Output:'
    signed: 'False'
    width:
    -   kind: bexpr
        oper: 'BMinus:'
        args:
        -   kind: ident
            name: nbits
        -   kind: int
            value: 1
    -   kind: int
        value: 0
-   kind: Wire
    name: VDD
    direct: 'Input:'
    signed: 'False'
-   kind: Wire
    name: VSS
    direct: 'Input:'
    signed: 'False'
decls:
- null
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: OUT
    rvalue:
        kind: cndexpr
        args:
        -   kind: cmpr_expr
            oper: 'BEq:'
            args:
            -   kind: ident
                name: INVRT
            -   kind: int
                value: 1
        -   kind: uexpr
            oper: 'Unot:'
            args:
            -   kind: ident
                name: IN
        -   kind: ident
            name: IN
    delay: 0
-   kind: specify
    variant: full
    delay_expr:
        kind: float
        delay: 20.0
    src_sgnls:
    - INVRT
    - IN
    edge: posedge
    dst_sgnls:
    - OUT