kind: verilog
module: CLOCK_SLCT
params:
-   kind: str
    name: circuit
    value: sync
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: FSTP
-   name: FSTN
-   name: E0P
-   name: E0N
-   name: SAP
-   name: SAN
-   name: SBP
-   name: SBN
-   name: AP
-   name: AN
-   name: BP
-   name: BN
-   name: OP
-   name: 'ON'
-   name: VDD
-   name: VSS
decls:
-   -   kind: Wire
        name: OP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Wire
        name: 'ON'
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Input
        name: FSTP
        signed: 'False'
