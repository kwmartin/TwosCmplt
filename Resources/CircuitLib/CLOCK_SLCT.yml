        - 0
        length: []
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: OP
    rvalue:
        kind: ident
        name: OUT
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: 'ON'
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: OP
    delay: 0
-   kind: always
    onlyif:
    -   edge: all
        node: FSTP
    -   edge: all
        node: FSTN
    -   edge: all
        node: E0P
    -   edge: all
        node: E0N
    -   edge: all
        node: SAP
    -   edge: all
        node: SAN
    -   edge: all
        node: SBP
    -   edge: all
        node: SBN
    -   edge: all
        node: AP
    -   edge: all
        node: AN
    -   edge: all
        node: BP
    -   edge: all
        node: BN
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_gate
            gate:
                kind: gt_expr
                oper: 'BAnd:'
                args:
                -   kind: ident
                    name: SAP
                -   kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: SBP
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: OUT
            rvalue:
                kind: ident
                name: AP
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_gate
            gate:
                kind: gt_expr
                oper: 'BAnd:'
                args:
                -   kind: gt_expr
                    oper: 'BAnd:'
                    args:
                    -   kind: ident
                        name: SBP
                    -   kind: uexpr
                        oper: 'Unot:'
                        args:
                        -   kind: ident
                            name: SAP
                -   kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: E0P
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: OUT
            rvalue:
                kind: ident
                name: BP
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_gate
            gate:
                kind: gt_expr
                oper: 'BAnd:'
                args:
                -   kind: ident
                    name: E0P
                -   kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: FSTP
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: OUT
            rvalue:
                kind: int
                value: 1'B0

