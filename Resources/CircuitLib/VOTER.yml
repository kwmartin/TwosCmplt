kind: verilog
module: VOTER
params:
-   kind: str
    name: circuit
    value: async
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: PLS1
-   name: PLS2
-   name: NEG1
-   name: NEG2
-   name: OP
-   name: 'ON'
-   name: VDD
-   name: VSS
decls:
-   -   kind: Input
        name: PLS1
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: PLS2
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: NEG1
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: NEG2
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VDD
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VSS
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: OP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: 'ON'
        signed: 'False'
        width:
        - 0
        - 0
        length: []
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: OP
    rvalue:
        kind: gt_expr
        oper: 'BAnd:'
        args:
        -   kind: gt_expr
            oper: 'BAnd:'
            args:
            -   kind: gt_expr
                oper: 'BOr:'
                args:
                -   kind: ident
                    name: PLS1
                -   kind: ident
                    name: PLS2
            -   kind: ident
                name: NEG1
        -   kind: ident
            name: NEG2
    delay: 40.0
-   kind: assign
    lvalue:
        kind: ident
        name: 'ON'
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: gt_expr
            oper: 'BAnd:'
            args:
            -   kind: gt_expr
                oper: 'BAnd:'
                args:
                -   kind: gt_expr
                    oper: 'BOr:'
                    args:
                    -   kind: ident
                        name: PLS1
                    -   kind: ident
                        name: PLS2
                -   kind: ident
                    name: NEG1
            -   kind: ident
                name: NEG2
    delay: 40.0

