                    name: cp
                -   kind: uexpr
                    oper: 'Unot:'
                    args:
                    -   kind: ident
                        name: cn
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: qp
            rvalue:
                kind: ident
                name: dp
        -   kind: noblckst
            lvalue:
                kind: ident
                name: qn
            rvalue:
                kind: uexpr
                oper: 'Unot:'
