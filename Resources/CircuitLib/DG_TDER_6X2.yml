behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: L0_IN
    rvalue:
        kind: cndexpr
        args:
        -   kind: ident
            name: L
        -   kind: ident
            name: LI
        -   kind: cndexpr
            args:
            -   kind: ident
                name: T
            -   kind: uexpr
                oper: 'Unot:'
                args:
                -   kind: ident
                    name: STATE
            -   kind: ident
                name: STATE
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: QP
    rvalue:
        kind: ident
        name: STATE
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: QN
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: STATE
    delay: 0
-   kind: initial
    stmnts:
    -   kind: blckst
        lvalue:
            kind: ident
            name: ENBL
        rvalue:
            kind: int
            value: 0
    -   kind: blckst
        lvalue:
            kind: ident
            name: STATE
        rvalue:
            kind: int
            value: 0
    -   kind: blckst
        lvalue:
            kind: ident
            name: chngs
        rvalue:
            kind: int
            value: 0
-   kind: always
    onlyif:
    -   edge: all
        node: CP
    -   edge: posedge
        node: R
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_expr
            oper: 'BLessThan:'
            args:
            -   kind: sys_tm
                name: time
            -   kind: float
                value: 100.0
        iftrue:
        -   kind: blckst
            lvalue:
                kind: ident
                name: STATE
            rvalue:
                kind: int
                value: 0
        -   kind: blckst
            lvalue:
                kind: ident
                name: ENBL
            rvalue:
                kind: int
                value: 0
        -   kind: blckst
            lvalue:
                kind: ident
                name: chngs
            rvalue:
                kind: int
                value: 0
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_ident
                node: R
            iftrue:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: STATE
                rvalue:
                    kind: int
                    value: 0
            ifelse:
            -   kind: ifst
                cmpr_expr:
                    kind: cmpr_expr
                    oper: 'BNotEq:'
                    args:
                    -   kind: ident
                        name: STATE
                    -   kind: ident
                        name: L0_IN
                iftrue:
                -   kind: noblckst
                    lvalue:
                        kind: ident
                        name: ENBL
                    rvalue:
                        kind: int
                        value: 1
                -   kind: noblckst
                    lvalue:
                        kind: ident
                        name: CLKB
                    rvalue:
                        kind: ident
                        name: CP
                -   kind: ifst
                    cmpr_expr:
                        kind: cmpr_unary
                        arg:
                            kind: uexpr
                            oper: 'Ulnot:'
                            args:
                            -   kind: ident
                                name: CP
                    iftrue:
                    -   kind: blckst
                        lvalue:
                            kind: ident
                            name: chngs
                        rvalue:
                            kind: bexpr
                            oper: 'BPlus:'
                            args:
                            -   kind: ident
                                name: chngs
                            -   kind: int
                                value: 1
                ifelse:
                -   kind: noblckst
                    lvalue:
                        kind: ident
                        name: ENBL
                    rvalue:
                        kind: int
                        value: 0
            -   kind: ifst
                cmpr_expr:
                    kind: cmpr_expr
                    oper: 'BLand:'
                    args:
                    -   kind: uexpr
                        oper: 'Ulnot:'
                        args:
                        -   kind: ident
                            name: CP
                    -   kind: ident
                        name: ENBL
                iftrue:
                -   kind: noblckst
                    lvalue:
                        kind: ident
                        name: STATE
                    rvalue:
                        kind: ident
                        name: L0_IN

