behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: QN
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: QP
    delay: 0
-   kind: initial
    stmnts:
