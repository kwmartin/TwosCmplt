        lvalue:
            kind: ident
            name: QP
        rvalue:
            kind: int
            value: 0
-   kind: always
    onlyif:
    -   edge: negedge
        node: CP
    -   edge: posedge
        node: RP
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_ident
            node: RP
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: QP
            rvalue:
                kind: int
                value: 0
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_expr
                oper: 'BLessThan:'
                args:
                -   kind: sys_tm
                    name: time
                -   kind: float
                    value: 100.0
            iftrue:
            -   kind: blckst
                lvalue:
                    kind: ident
                    name: QP
                rvalue:
                    kind: int
                    value: 0
            ifelse:
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: QP
                rvalue:
                    kind: ident
                    name: DP

