kind: verilog
module: DG_DX_4X2
params:
-   kind: str
    name: circuit
    value: sync
-   kind: Int
    name: delay
    value: 5
io_ports:
-   name: D
-   name: INIT
-   name: D0
-   name: CLK
-   name: QP
-   name: QN
-   name: VDD
-   name: VSS
decls:
-   -   kind: Input
        name: D
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: INIT
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: D0
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: CLK
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VDD
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Input
        name: VSS
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Output
        name: QP
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Output
        name: QN
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Reg
        name: STATE
        signed: 'False'
        width:
        - 0
        - 0
        length: []
    -   kind: Reg
        name: CLKB
        signed: 'False'
        width:
        - 0
        - 0
        length: []
-   -   kind: Integer
        name: chngs
        signed: integer
        width:
        -   kind: int
            value: 31
        -   kind: int
            value: 0
behav_blcks:
-   kind: assign
    lvalue:
        kind: ident
        name: QP
    rvalue:
        kind: ident
        name: STATE
    delay: 0
-   kind: assign
    lvalue:
        kind: ident
        name: QN
    rvalue:
        kind: uexpr
        oper: 'Unot:'
        args:
        -   kind: ident
            name: STATE
    delay: 0
-   kind: initial
    stmnts:
    -   kind: blckst
        lvalue:
            kind: ident
            name: STATE
        rvalue:
            kind: ident
            name: D0
    -   kind: blckst
        lvalue:
            kind: ident
            name: CLKB
        rvalue:
            kind: int
            value: 0
    -   kind: blckst
        lvalue:
            kind: ident
            name: chngs
        rvalue:
            kind: int
            value: 0
-   kind: always
    onlyif:
    -   edge: all
        node: CLK
    stmnts:
        kind: noblckst
        lvalue:
            kind: ident
            name: CLKB
        rvalue:
            kind: ident
            name: CLK
-   kind: always
    onlyif:
    -   edge: negedge
        node: CLK
    -   edge: posedge
        node: INIT
    stmnts:
    -   kind: ifst
        cmpr_expr:
            kind: cmpr_expr
            oper: 'BLor:'
            args:
            -   kind: cmpr_expr
                oper: 'BLessThan:'
                args:
                -   kind: sys_tm
                    name: time
                -   kind: float
                    value: 100.0
            -   kind: ident
                name: INIT
        iftrue:
        -   kind: noblckst
            lvalue:
                kind: ident
                name: STATE
            rvalue:
                kind: ident
                name: D0
        ifelse:
        -   kind: ifst
            cmpr_expr:
                kind: cmpr_expr
                oper: 'BNotEq:'
                args:
                -   kind: ident
                    name: STATE
                -   kind: ident
                    name: D
            iftrue:
            -   kind: blckst
                lvalue:
                    kind: ident
                    name: chngs
                rvalue:
                    kind: bexpr
                    oper: 'BPlus:'
                    args:
                    -   kind: ident
                        name: chngs
                    -   kind: int
                        value: 1
            -   kind: noblckst
                lvalue:
                    kind: ident
                    name: STATE
                rvalue:
                    kind: ident
                    name: D

